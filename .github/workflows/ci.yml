name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar o projeto
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Testes
        run: pytest -q
